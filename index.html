<style>
:root{

  --s0:#dedcd5;--s1:#86b6ef;--s2:#2a78d6;--s3:#104281;--s4:repeating-linear-gradient(45deg,#dedcd5 0 2px,transparent 2px 5px);

    --accent:#3987e5;--accent-ink:#fff;--accent-soft:#16263b;
    --good:#5ccb8a;--good-bg:#16301f;--bad:#ef7473;--bad-bg:#3a1c1b;--warn-bg:#33290f;
    --s0:#363632;--s1:#256abf;--s2:#5598e7;--s3:#b7d3f6;--s4:repeating-linear-gradient(45deg,#3e3e3a 0 2px,transparent 2px 5px);
    --h0:#262624;--h1:#104281;--h2:#1c5cab;--h3:#3987e5;--h4:#86b6ef;
    --ser1:#3987e5;--ser2:#d95926;--grid:#2a2a28;--p0:#363632;--p1:#7a3518;--p2:#d95926;--p3:#f4ab8a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211;--card:#1b1b1a;--card2:#202020;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8d86;--line:#2e2e2c;
  --accent:#3987e5;--accent-ink:#fff;--accent-soft:#16263b;
  --good:#5ccb8a;--good-bg:#16301f;--bad:#ef7473;--bad-bg:#3a1c1b;--warn-bg:#33290f;

  --h0:#262624;--h1:#104281;--h2:#1c5cab;--h3:#3987e5;--h4:#86b6ef;
  --ser1:#3987e5;--ser2:#d95926;--grid:#2a2a28;--p0:#363632;--p1:#7a3518;--p2:#d95926;--p3:#f4ab8a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{touch-action:manipulation}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:ui-serif,"New York",Georgia,serif;font-size:22px;margin:0;letter-spacing:-.01em}
.globe{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:17px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.err{background:var(--bad)}
nav.tabs{display:flex;gap:2px;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs button .ic{display:block;font-size:20px;line-height:1.1;margin-bottom:1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;padding:6px 2px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:10.5px;text-align:center}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-family:ui-serif,"New York",Georgia,serif;font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.card h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--ink2);margin:0 0 12px;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.hero{background:linear-gradient(135deg,var(--accent),#1c5cab);color:#fff;border:0}
.hero .sub{color:rgba(255,255,255,.85)}
.hero h2{font-size:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.white{background:#fff;color:#1c5cab;border-color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:14px 22px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3 .tile .n{font-size:20px}.grid3 .tile{padding:10px}}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .n{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:transparent}
.bar>span{display:block;height:100%}
.bar>span:first-child{border-radius:4px 0 0 4px}.bar>span:last-child{border-radius:0 4px 4px 0}
.bar>span:only-child{border-radius:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.prow{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.prow .pc{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
@media (max-width:560px){.prow{grid-template-columns:100px 1fr 44px;font-size:13px}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.gray{background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv>:last-child{text-align:right}
ul.clean{list-style:none;padding:0;margin:0}
.mil li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mil li:first-child{border-top:0}
.mil .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.mil .done .ck{background:var(--good);border-color:var(--good);color:#fff}
.mil .done{color:var(--ink2)}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qhead .t{font-weight:600;font-size:14px;flex:1;min-width:0}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.qcard{text-align:center;padding:30px 20px}
.qcard .ask{color:var(--ink2);font-size:15px;margin-bottom:6px}
.qcard .flag{font-size:44px;line-height:1.1;margin-bottom:4px}
.qcard .country{font-family:ui-serif,"New York",Georgia,serif;font-size:32px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.qcard .meta{margin-top:8px}
.ansrow{display:flex;gap:8px;margin-top:22px}
.ansrow input{flex:1;min-width:0;padding:14px 16px;font-size:18px;border-radius:12px;border:2px solid var(--line);background:var(--card2);outline:none}
.ansrow input:focus{border-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{padding:14px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card2);cursor:pointer;font-size:16px;font-weight:600;text-align:left;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{width:24px;height:24px;border-radius:6px;background:var(--line);font-size:12px;display:grid;place-items:center;flex:none;color:var(--ink2)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:18px;border-radius:14px;padding:14px 16px;text-align:left}
.fb.ok{background:var(--good-bg)}.fb.ko{background:var(--bad-bg)}
.fb .h{font-weight:700;font-size:16px}
.fb.ok .h{color:var(--good)}.fb.ko .h{color:var(--bad)}
.fb .cap{font-size:20px;font-weight:700;margin-top:2px}
.fb .note{font-size:13px;color:var(--ink2);margin-top:6px}
.kbd{font-size:11px;color:var(--muted);margin-top:10px}
.study .cap{font-family:ui-serif,"New York",Georgia,serif;font-size:34px;color:var(--accent);font-weight:700;margin:6px 0 2px}
.study .note{background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:14px;text-align:left}
/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,select.inp,textarea{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.filters input{flex:1 1 180px}
.lrow{display:grid;grid-template-columns:28px 1fr 1fr 96px;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);font-size:14px}
.lrow .f{font-size:20px}
.lrow .cap.hid{filter:blur(6px);cursor:pointer;user-select:none}
@media (max-width:520px){.lrow{grid-template-columns:24px 1fr 1fr;}.lrow .st{grid-column:2/4}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.chart .lbl{fill:var(--ink2);font-size:13px;font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.35;z-index:50;opacity:0;transition:opacity .1s;max-width:240px}
.tip.on{opacity:1}
.hm rect{cursor:default}
.confirm{background:var(--warn-bg);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.loader{padding:60px 0;text-align:center;color:var(--muted)}
.res-big{font-family:ui-serif,"New York",Georgia,serif;font-size:54px;font-weight:700;line-height:1;letter-spacing:-.02em}
.mistakes{columns:2;column-gap:20px;font-size:14px}
@media (max-width:520px){.mistakes{columns:1}}
.mistakes div{break-inside:avoid;padding:3px 0}
details summary{cursor:pointer;color:var(--ink2);font-size:14px}
label.radio{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}
.sr{position:absolute;left:-9999px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.tbl td,table.tbl th{padding:5px 6px;border-top:1px solid var(--line);text-align:right}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
</style>
</head>

const CONT={eu:'Europa',nc:'Amèrica del Nord i Central',sa:'Amèrica del Sud',as:'Àsia',af:'Àfrica',oc:'Oceania'};
const CONT_ORDER=['eu','nc','sa','as','af','oc'];
const PH={
  1:{name:'Fase 1 · Essencials',short:'Fase 1',desc:'Els estats més coneguts: tot Europa, les grans potències, tota l\'Amèrica continental i gairebé tota Àsia i Àfrica.'},
  2:{name:'Fase 2 · Resta del món',short:'Fase 2',desc:'Els estats que falten: illes del Carib i del Pacífic, Àfrica petita, microestats asiàtics, Kosovo i Palestina.'},
  3:{name:'Fase 3 · Territoris',short:'Fase 3',desc:'Territoris i dependències amb capital pròpia: Grenlàndia, Puerto Rico, Bermudes, Polinèsia Francesa…'}
};
const C = RAW.trim().split('\n').map((l,i)=>{const p=l.split(';');return {id:p[0],ph:+p[1],ct:p[2],country:p[3],cap:p[4],al:p[5]?p[5].split('|'):[],note:p.slice(6).join(';')||'',ord:i};});
const BY={}; C.forEach(c=>BY[c.id]=c);
const OTHER_CAPS=new Set();
const idsOf=p=>C.filter(c=>c.ph===p).map(c=>c.id);
const STATUS=['Per aprendre','En procés','Apresa','Dominada','No vista encara'];
const INT=[0,1,3,7,14,30,60,120];

/* ============ UTILITATS ============ */
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dnum=k=>{const [y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
const nkey=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());};
const T=()=>dkey(); const tn=()=>dnum(T());
const MESOS=['gen','febr','març','abr','maig','juny','jul','ag','set','oct','nov','des'];
const fmtD=n=>{const d=new Date(n*864e5);return d.getUTCDate()+' '+MESOS[d.getUTCMonth()];};
const fmtDY=n=>{const d=new Date(n*864e5);return d.getUTCDate()+' '+MESOS[d.getUTCMonth()]+' '+d.getUTCFullYear();};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const flag=id=>{if(!/^[A-Z]{2}$/.test(id)||id==='XK')return '🏳️';return String.fromCodePoint(...[...id].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));};
const pct=(a,b)=>b?Math.round(a*100/b):0;

function norm(s){
  let x=String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  x=x.replace(/[·.]/g,'').replace(/['’`´]/g,' ').replace(/[-–,()\/]/g,' ').replace(/\s+/g,' ').trim();
  x=x.replace(/^st /,'saint ').replace(/\b(ciutat|ciudad|city)\s+(de|del|of)\s+/g,'').replace(/^(el|la|l|les|los|the)\s+/,'');
  return x.replace(/ /g,'');
}
function lev(a,b){
  if(a===b)return 0; const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}
  return prev[n];
}
function capsSet(){if(!OTHER_CAPS.size)C.forEach(c=>OTHER_CAPS.add(norm(c.cap)));}
function check(id,text){
  capsSet();
  const c=BY[id]; const g=norm(text); if(!g) return {ok:false,typo:false};
  const cands=[c.cap,...c.al].map(norm);
  if(cands.includes(g)) return {ok:true,typo:false};
  if(OTHER_CAPS.has(g)) return {ok:false,typo:false};
  for(const k of cands){const tol=k.length<=4?0:k.length<=7?1:2; if(lev(k,g)<=tol) return {ok:true,typo:true};}
  return {ok:false,typo:false};
}

/* ============ ESTAT I DESAT ============ */
const KEY='capitals-mon-v1';
function fresh(){return {v:1,created:T(),updated:0,settings:{newPerDay:15,mode:'write'},cards:{},placement:{},days:{}};}
let S=fresh();
let ref=null, saveTimer=null, saving=false, again=false, syncState='local';
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)return o;}}catch(e){}return null;}
function setSync(st,msg){syncState=st;const el=document.getElementById('sync');if(!el)return;
  const txt=msg||'Desat al mòbil';
  el.innerHTML='<span class="dot '+(st==='ok'?'ok':st==='err'?'err':'')+'"></span><span>'+esc(txt)+'</span>';}
function day(){const k=T();return S.days[k]||(S.days[k]={q:0,ok:0,n:0,l:0,m:0});}
function snap(){const d=day();let l=0,m=0;for(const id in S.cards){const b=S.cards[id].b;if(b>=3)l++;if(b>=5)m++;}d.l=l;d.m=m;}
function save(){
  snap(); S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(ref){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1000);setSync('saving');}
}
async function flush(){
  if(!ref)return; if(saving){again=true;return;}
  saving=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)));setSync('ok');}
  catch(e){ if(e&&e.code==='unavailable'){try{await new Promise(r=>setTimeout(r,800+Math.random()*800));await ref.set(JSON.parse(JSON.stringify(S)));setSync('ok');}catch(e2){setSync('err');}} else setSync('err'); }
  saving=false; if(again){again=false;flush();}
}
async function initStore(){
  const local=loadLocal(); if(local) S=local;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  setSync('local');
}

/* ============ LÒGICA D'APRENENTATGE ============ */
const bOf=id=>S.cards[id]?S.cards[id].b:0;
function seen(id){if(S.cards[id])return true;for(const p in S.placement){if(S.placement[p].res&&(id in S.placement[p].res))return true;}return false;}
const stOf=id=>{const b=bOf(id);return b===0?(seen(id)?0:4):b<=2?1:b<=4?2:3;};
function counts(ids){const r=[0,0,0,0,0];ids.forEach(id=>r[stOf(id)]++);return r;}
function learnedRatio(p){const ids=idsOf(p);return ids.filter(id=>bOf(id)>=3).length/ids.length;}
function unlocked(p){return p===1||learnedRatio(p-1)>=0.8;}
function openPhases(){return [1,2,3].filter(p=>p===1||(unlocked(p)&&unlocked(p-1))||placementDone(p));}
function dueIds(){const t=tn();return shuffle(Object.keys(S.cards).filter(id=>S.cards[id].b>0&&S.cards[id].d<=t&&BY[id])).sort((a,b)=>S.cards[a].d-S.cards[b].d);}
function newPool(){
  const out=[];
  for(const p of [1,2,3]){
    if(!unlocked(p))break;
    const pool=C.filter(c=>c.ph===p&&bOf(c.id)===0);
    pool.sort((a,b)=>CONT_ORDER.indexOf(a.ct)-CONT_ORDER.indexOf(b.ct)||a.ord-b.ord);
    out.push(...pool.map(c=>c.id));
  }
  return out;
}
function newLeftToday(){return Math.max(0,S.settings.newPerDay-(S.days[T()]?S.days[T()].n:0));}
function srs(id,ok,slow){
  const c=S.cards[id]||(S.cards[id]={b:0,d:0,ok:0,ko:0});
  if(ok){c.ok++;if(!(slow&&c.b>=3))c.b=c.b===0?1:Math.min(7,c.b+1);}else{c.ko++;c.b=1;}
  c.d=tn()+INT[c.b];
}
function streak(){let n=0,d=tn();if(!(S.days[nkey(d)]&&S.days[nkey(d)].q>0))d--;while(S.days[nkey(d)]&&S.days[nkey(d)].q>0){n++;d--;}return n;}
function placementDone(p){return !!(S.placement[p]&&S.placement[p].done);}
function placementInfo(p){const P=S.placement[p];if(!P)return null;const ans=Object.keys(P.res).length;const ok=Object.values(P.res).filter(v=>v===1).length;return {P,ans,ok,total:P.order.length};}
function level(r){return r>=.85?'Expert':r>=.65?'Avançat':r>=.4?'Intermedi':'Inicial';}
function dueOn(n){return Object.values(S.cards).filter(c=>c.b>0&&c.d===n).length;}
function remainingNew(p){return C.filter(c=>c.ph===p&&bOf(c.id)===0).length;}

  const due=dueIds(), nl=newLeftToday(), pool=newPool(), nNew=Math.min(nl,pool.length);

  }
  const lb=S.lastBackupN||0; if(Object.keys(S.cards).length>20&&tn()-lb>=7)h+='<div class="confirm" style="margin:0 0 14px">💾 Fa més d\'una setmana que no desas cap còpia de seguretat. <button class="btn" style="margin-left:6px;padding:6px 10px" onclick="go(\'ajustos\')">Desa-la</button></div>';

  return h;
}

/* ============ EXAMEN DE NIVELL ============ */
function startPlacement(p){
  let P=S.placement[p];
  if(!P){
    const order=[];
    CONT_ORDER.forEach(ct=>order.push(...shuffle(C.filter(c=>c.ph===p&&c.ct===ct&&bOf(c.id)===0).map(c=>c.id))));
    P=S.placement[p]={order,res:{},done:false,start:T()};
  }
  const items=P.order.filter(id=>!(id in P.res)).map(id=>({id,kind:'pl'}));
  if(!items.length){finishPlacement(p);return;}
  startQuiz({kind:'placement',ph:p,title:'Examen de nivell · '+PH[p].short,items,mode:'write',requeue:false,total:P.order.length,done:Object.keys(P.res).length,
    onFirst:(it,ok)=>{P.res[it.id]=ok?1:0; if(ok){S.cards[it.id]={b:3,d:tn()+2+Math.floor(Math.random()*13),ok:1,ko:0};}},
    onDone:()=>finishPlacement(p)});
}
function finishPlacement(p){
  const P=S.placement[p]; P.done=true; P.end=T(); save();
  const byCt={}; P.order.forEach(id=>{const ct=BY[id].ct;byCt[ct]=byCt[ct]||[0,0];byCt[ct][1]++;if(P.res[id]===1)byCt[ct][0]++;});
  const ok=Object.values(P.res).filter(v=>v===1).length, tot=P.order.length;
  const miss=P.order.filter(id=>P.res[id]!==1);
  const days=Math.ceil(miss.length/S.settings.newPerDay);
  RES={type:'placement',p,ok,tot,byCt,miss,days};
  route='result';Q=null;render();
}

/* ============ SESSIÓ DIÀRIA ============ */
function startDaily(extra){
  const due=dueIds();
  const n=extra>0?extra:newLeftToday();
  const news=newPool().slice(0,n);
  const items=shuffle([...due.map(id=>({id,kind:'rev'})),...news.map(id=>({id,kind:'new'}))]);

  const cfg={kind:'daily',title:extra?'Capitals extra':'Sessió d\'avui',items,mode:S.settings.mode,requeue:true,total:items.length,done:0,
    onFirst:(it,ok,rt,m)=>{srs(it.id,ok,ok&&rt!=null&&spdClass(rt,m)===0); if(it.kind==='new')day().n++;},
    onDone:(q)=>{RES={type:'daily',q};route='result';Q=null;render();}};

}

/* ============ MOTOR DE TEST ============ */
let qToken=0, lastAnsAt=0, sprintTimer=null;
const now=()=>performance.now();
const SPD=['Lenta','Ràpida','⚡ Automàtica'];
function spdClass(ms,m){if(ms==null)return -1;return m==='c'?(ms<=2500?2:ms<=4500?1:0):(ms<=2000?2:ms<=4000?1:0);}
function spd(id){const c=S.cards[id];if(!c)return -1;if(c.rw!=null)return spdClass(c.rw,'w');if(c.rc!=null)return spdClass(c.rc,'c');return -1;}
function recordSpeed(id,ms,m){
  const c=S.cards[id]; const x=Math.min(ms,15000);
  if(c){const k=m==='c'?'rc':'rw';c[k]=c[k]==null?Math.round(x):Math.round(c[k]*0.6+x*0.4);}
  const d=day();d[m+'s']=(d[m+'s']||0)+Math.round(x);d[m+'n']=(d[m+'n']||0)+1;
}
const fmtS=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
function startQuiz(cfg){
  clearInterval(sprintTimer);
  Q=Object.assign({queue:cfg.items.slice(),first:{},answered:cfg.done||0,cur:null,phase:'ask',wrong:[],nAns:0,nOk:0,firstOk:0,firstN:0,times:[]},cfg);
  route='quiz';quitAsk=false;
  if(Q.sprint){Q.endAt=Date.now()+Q.secs*1000;sprintTimer=setInterval(tickSprint,200);}
  render(); window.scrollTo(0,0); nextQ();
}
function makeOpts(id,reverse){
  const c=BY[id]; const pool=shuffle(C.filter(x=>x.id!==id&&x.ct===c.ct&&(c.ph===3||x.ph<3)));
  const out=[id],seen=new Set([reverse?c.country:c.cap]);
  for(const x of pool){const lab=reverse?x.country:x.cap;if(!seen.has(lab)){seen.add(lab);out.push(x.id);}if(out.length===4)break;}
  return shuffle(out);
}
function endQuiz(){clearInterval(sprintTimer);const q=Q;q.onDone(q);}
function nextQ(){
  qToken++;
  if(!Q)return;
  if(Q.sprint&&Date.now()>=Q.endAt)return endQuiz();
  if(!Q.queue.length){if(Q.refill)Q.queue=Q.refill();else return endQuiz();}
  Q.cur=Q.queue.shift();Q.phase='ask';Q.res=null;Q.chosen=null;Q.given='';Q.rt=null;
  Q.opts=(Q.mode==='choice'||Q.reverse)?makeOpts(Q.cur.id,Q.reverse):null;
  const inp=document.getElementById('ans');if(inp)inp.value='';
  paintQuiz();
  Q.shownAt=now();Q.keyAt=null;
}
function tickSprint(){
  if(!Q||!Q.sprint||route!=='quiz'){clearInterval(sprintTimer);return;}
  const left=Math.max(0,Q.endAt-Date.now());
  const a=document.getElementById('sp-left'),b=document.getElementById('sp-bar');
  if(a)a.textContent=Math.ceil(left/1000)+' s'; if(b)b.style.width=(left*100/(Q.secs*1000))+'%';
  if(left<=0&&Q.phase==='ask'&&!quitAsk)endQuiz();
}
function vQuiz(){return '<div id="qh"></div><div class="card qcard"><div id="qq"></div><div id="qa"></div><div id="qf"></div></div>';}

  else{const rep=Q.queue.filter(x=>x.rep).length;

    if(r.ok){f+='<div class="fb ok"><div class="h">✓ Correcte!'+(r.typo?' (vigila l\'ortografia)':'')+'</div>'+(r.typo||(!Q.opts&&!Q.sprint)?'<div class="cap">'+esc(ans)+'</div>':'')+sp+(c.note&&!Q.sprint?'<div class="note">💡 '+esc(c.note)+'</div>':'')+'</div>';}
    else{f+='<div class="fb ko"><div class="h">✗ '+(Q.given?'No és correcte':'Cap problema, ara ja la saps')+'</div><div class="note" style="margin-top:2px">'+(Q.reverse?'És la capital de':'Resposta correcta')+'</div><div class="cap">'+esc(ans)+'</div>'+

function afterQuiz(){}
function formSubmit(){if(!Q)return;if(Q.phase==='feedback'){if(Date.now()-lastAnsAt>250)cont();return;}submitWrite();}
function submitWrite(){const i=document.getElementById('ans');const v=i?i.value.trim():'';if(!v)return dontKnow();answer(check(Q.cur.id,v),v);}
function dontKnow(){if(Q&&Q.phase==='ask')answer({ok:false,typo:false},'');}
function choose(oid){if(!Q||Q.phase!=='ask')return;Q.chosen=oid;answer({ok:oid===Q.cur.id,typo:false},Q.reverse?BY[oid].country:BY[oid].cap);}
function answer(res,given){
  if(Q.phase!=='ask')return;
  const t=now(); const it=Q.cur;
  let rt=null; if(given)rt=Q.opts?t-Q.shownAt:((Q.keyAt!=null?Q.keyAt:t)-Q.shownAt);
  Q.res=res; Q.given=given; Q.rt=rt; Q.phase='feedback'; lastAnsAt=Date.now();
  const m=Q.opts?'c':'w';
  const first=!(it.id in Q.first);
  if(first){Q.first[it.id]=res.ok;Q.answered++;Q.firstN++;if(res.ok)Q.firstOk++;if(Q.onFirst)Q.onFirst(it,res.ok,rt,m);}
  if(res.ok&&rt!=null&&!Q.reverse){recordSpeed(it.id,rt,m);Q.times.push(rt);}
  Q.nAns++;if(res.ok)Q.nOk++;
  const d=day();d.q++;if(res.ok)d.ok++;
  if(!res.ok){if(!Q.wrong.includes(it.id))Q.wrong.push(it.id);
    if(Q.requeue){const pos=Math.min(Q.queue.length,3+Math.floor(Math.random()*3));Q.queue.splice(pos,0,{id:it.id,kind:it.kind,rep:true});}}
  save(); paintQuiz();
  const tk=qToken; let wait=null;
  if(Q.sprint)wait=res.ok?(res.typo?900:300):1500;
  else if(res.ok&&!res.typo)wait=BY[it.id].note?2200:900;
  if(wait!=null)setTimeout(()=>{if(Q&&tk===qToken&&Q.phase==='feedback'&&!quitAsk)cont();},wait);
}

document.addEventListener('keydown',e=>{
  if(route==='study'){if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();if(ST.i<ST.list.length-1){ST.i++;render();}else startQuiz(ST.cfg);}else if(e.key==='ArrowLeft'&&ST.i>0){ST.i--;render();}return;}
  if(route!=='quiz'||!Q||quitAsk)return;
  if(e.target&&e.target.id==='ans')return;
  if(Q.phase==='feedback'&&e.key==='Enter'){if(Date.now()-lastAnsAt<250)return;e.preventDefault();cont();return;}
  if(Q.phase==='ask'&&Q.opts&&/^[1-4]$/.test(e.key)){const o=Q.opts[+e.key-1];if(o)choose(o);}
});

/* ============ CONTRARELLOTGE ============ */
let SP={mode:'write'};
function sprintPool(){
  let pool=Object.keys(S.cards).filter(id=>S.cards[id].b>=3&&BY[id]);
  if(pool.length<8)pool=Object.keys(S.cards).filter(id=>S.cards[id].b>=1&&BY[id]);
  return pool;
}
function bestSprint(m){return (S.sprints||[]).filter(s=>s.m===m).reduce((a,s)=>Math.max(a,s.n),0);}
function startSprint(o){
  o=o||{}; if(o.mode)SP.mode=o.mode;
  const mode=SP.mode; const pool=o.ids&&o.ids.length>=4?o.ids:sprintPool();
  if(pool.length<4){go('practica');setTimeout(()=>{const m=document.getElementById('spmsg');if(m)m.textContent='Encara no tens prou capitals apreses. Fes primer l\'examen de nivell.';},0);return;}
  const build=()=>{const slow=pool.filter(id=>spd(id)<=0);return shuffle([...pool,...slow]).map(id=>({id,kind:'sp'}));};
  const prev=bestSprint(mode);
  startQuiz({kind:'sprint',sprint:true,secs:60,title:'⚡ Contrarellotge',items:build(),refill:build,mode,requeue:false,total:0,done:0,
    onDone:(q)=>{const avg=q.times.length?Math.round(q.times.reduce((a,b)=>a+b,0)/q.times.length):null;
      S.sprints=(S.sprints||[]);S.sprints.push({d:T(),m:mode,n:q.nOk,e:q.nAns-q.nOk,a:avg});if(S.sprints.length>150)S.sprints=S.sprints.slice(-150);save();
      RES={type:'sprint',q,avg,prev,record:q.nOk>prev&&prev>0,first:prev===0,o};route='result';Q=null;render();}});
}

    [ln(F1)>=124,'80% de la Fase 1 apresa → s\'obre la Fase 2 ('+ln(F1)+'/124)'],
    [dm(F1)===155,'Fase 1 dominada del tot ('+dm(F1)+'/155)'],
    [ln(F2)>=34,'80% de la Fase 2 apresa → s\'obre la Fase 3 ('+ln(F2)+'/34)'],
    [ln(allS)===197,'Les 197 capitals d\'estats apreses ('+ln(allS)+'/197)'],
    [ln(allT)===allT.length,'Totes les '+allT.length+' capitals apreses, territoris inclosos'],
    [autoCount()>=50,'50 capitals automàtiques ⚡ ('+autoCount()+'/50)'],[autoCount()>=150,'150 capitals automàtiques ⚡ ('+autoCount()+'/150)'],
    [Math.max(bestSprint('write'),bestSprint('choice'))>=20,'Contrarellotge: 20 encerts en 60 s (rècord '+Math.max(bestSprint('write'),bestSprint('choice'))+')'],
    [Math.max(bestSprint('write'),bestSprint('choice'))>=30,'Contrarellotge: 30 encerts en 60 s'],
    [best>=7,'Ratxa de 7 dies'],[best>=30,'Ratxa de 30 dies']];
  h+='<div class="card"><h2>Fites</h2><ul class="clean mil">'+M.map(([ok,t])=>'<li class="'+(ok?'done':'')+'"><span class="ck">'+(ok?'✓':'')+'</span><div>'+t+'</div></li>').join('')+'</ul></div>';
  return h;
}

/* ============ VISTA: LLISTA ============ */
function vLlista(){
  const o=listOpts;
  return '<div class="card"><h2>Totes les capitals</h2><p class="sub">Consulta-les o activa «Amaga les capitals» per autoavaluar-te (toca per revelar).</p>'+
    '<div class="filters"><input id="lq" placeholder="Cerca país o capital…" value="'+esc(o.q)+'">'+
    '<select id="lct"><option value="">Tots els continents</option>'+CONT_ORDER.map(c=>'<option value="'+c+'" '+(o.ct===c?'selected':'')+'>'+CONT[c]+'</option>').join('')+'</select>'+
    '<select id="lph"><option value="">Totes les fases</option>'+[1,2,3].map(p=>'<option value="'+p+'" '+(o.ph==p?'selected':'')+'>'+PH[p].short+'</option>').join('')+'</select>'+
    '<select id="lst"><option value="">Tots els estats</option>'+[4,0,1,2,3].map(i=>'<option value="'+i+'" '+(o.st===String(i)?'selected':'')+'>'+STATUS[i]+'</option>').join('')+'</select>'+
    '<label class="chip"><input type="checkbox" id="lhide" '+(o.hide?'checked':'')+'> Amaga les capitals</label></div><div id="lres"></div></div>';
}
function listRows(){
  const o=listOpts,q=norm(o.q);
  const rows=C.filter(c=>(!o.ct||c.ct===o.ct)&&(!o.ph||c.ph==o.ph)&&(o.st===''||stOf(c.id)===+o.st)&&(!q||norm(c.country).includes(q)||norm(c.cap).includes(q)||c.al.some(a=>norm(a).includes(q))));
  return '<div class="muted" style="margin-bottom:4px">'+rows.length+' resultats</div>'+rows.map(c=>{const s=stOf(c.id);
    return '<div class="lrow"><div class="f">'+flag(c.id)+'</div><div>'+esc(c.country)+'</div><div class="cap'+(o.hide?' hid':'')+'" onclick="this.classList.remove(\'hid\')"><b>'+esc(c.cap)+'</b></div><div class="st"><span class="chip"><i class="sw" style="background:var(--s'+s+')"></i>'+STATUS[s]+(spd(c.id)===2?' ⚡':'')+'</span></div></div>';}).join('');
}
function bindList(){
  const upd=()=>{listOpts.q=document.getElementById('lq').value;listOpts.ct=document.getElementById('lct').value;listOpts.ph=document.getElementById('lph').value;listOpts.st=document.getElementById('lst').value;listOpts.hide=document.getElementById('lhide').checked;document.getElementById('lres').innerHTML=listRows();};
  ['lq','lct','lph','lst','lhide'].forEach(id=>{const el=document.getElementById(id);el.addEventListener(id==='lq'?'input':'change',upd);});
  document.getElementById('lres').innerHTML=listRows();
}

/* ============ VISTA: PRÀCTICA ============ */
let FP={src:'seen',ct:'',mode:'choice',n:20};
function vPractica(){
  const sel=(id,opts,val)=>'<select class="inp" id="'+id+'" onchange="FP.'+id.slice(2)+'=this.value">'+opts.map(([v,l])=>'<option value="'+v+'" '+(String(val)===String(v)?'selected':'')+'>'+l+'</option>').join('')+'</select>';
  const bw=bestSprint('write'),bc=bestSprint('choice');
  return '<div class="card"><h2>⚡ Contrarellotge 60 s</h2><p class="sub">Tantes capitals com puguis en un minut, només amb les que ja tens apreses (les lentes surten més sovint). Mesura el <b>temps de reacció</b>: des que surt el país fins que comences a escriure (o tries l\'opció).</p>'+
    '<div class="kv"><span>Mode</span><select class="inp" onchange="SP.mode=this.value"><option value="write" '+(SP.mode==='write'?'selected':'')+'>Escriure</option><option value="choice" '+(SP.mode==='choice'?'selected':'')+'>Opcions</option></select></div>'+
    '<div class="kv"><span>Rècords</span><b>Escrivint: '+(bw||'—')+' · Opcions: '+(bc||'—')+'</b></div>'+
    '<div class="kv"><span>Automàtica ⚡</span><span>menys de 2 s escrivint · 2,5 s amb opcions</span></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn pri" onclick="startSprint()">Comença</button></div><div id="spmsg" class="muted" style="margin-top:8px"></div></div>'+
    '<div class="card"><h2>Pràctica lliure</h2><p class="sub">Rondes extra sense afectar el calendari de repassos. Ideal per reforçar un continent o fer el mode invers (capital → país).</p>'+
    '<div class="kv"><span>Quines</span>'+sel('fpsrc',[['seen','Les que ja he estudiat'],['hard','Les que més em costen'],['p1','Tota la Fase 1'],['p2','Tota la Fase 2'],['p3','Tota la Fase 3'],['all','Totes']],FP.src)+'</div>'+
    '<div class="kv"><span>Continent</span>'+sel('fpct',[['','Tots'],...CONT_ORDER.map(c=>[c,CONT[c]])],FP.ct)+'</div>'+
    '<div class="kv"><span>Mode</span>'+sel('fpmode',[['choice','Opcions (4 respostes)'],['write','Escriure'],['reverse','Invers: capital → país']],FP.mode)+'</div>'+
    '<div class="kv"><span>Preguntes</span>'+sel('fpn',[[10,'10'],[20,'20'],[40,'40'],[999,'Totes']],FP.n)+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn pri" onclick="startFree()">Comença</button></div><div id="fpmsg" class="muted" style="margin-top:8px"></div></div>';
}
function startFree(o){
  if(o)Object.assign(FP,o);
  let pool=C.filter(c=>!FP.ct||c.ct===FP.ct);
  if(FP.src==='seen')pool=pool.filter(c=>bOf(c.id)>0);
  else if(FP.src==='hard'){pool=pool.filter(c=>S.cards[c.id]&&S.cards[c.id].ko>0).sort((a,b)=>S.cards[b.id].ko-S.cards[a.id].ko).slice(0,20);}
  else if(FP.src!=='all')pool=pool.filter(c=>c.ph===+FP.src.slice(1));
  if(!pool.length){go('practica');setTimeout(()=>{const m=document.getElementById('fpmsg');if(m)m.textContent='No hi ha cap capital amb aquests filtres encara.';},0);return;}
  const items=shuffle(pool).slice(0,+FP.n).map(c=>({id:c.id,kind:'free'}));
  startQuiz({kind:'free',title:FP.mode==='reverse'?'Pràctica · mode invers':'Pràctica lliure',items,mode:FP.mode==='write'?'write':'choice',reverse:FP.mode==='reverse',requeue:false,total:items.length,done:0,
    onDone:(q)=>{RES={type:'free',q};route='result';Q=null;render();}});
}

/* ============ VISTA: AJUSTOS ============ */
function vAjustos(){
  return '<div class="card"><h2>Ajustos</h2>'+
    '<h3 style="margin-top:12px">Capitals noves per dia</h3><select class="inp" onchange="S.settings.newPerDay=+this.value;save();render()">'+[5,10,15,20,25,30].map(n=>'<option '+(S.settings.newPerDay===n?'selected':'')+'>'+n+'</option>').join('')+'</select>'+
    '<p class="muted">15 és un bon equilibri. Més noves cada dia vol dir més repassos els dies següents.</p>'+
    '<h3 style="margin-top:16px">Com vols respondre a la sessió diària</h3>'+
    '<label class="radio"><input type="radio" name="md" '+(S.settings.mode==='write'?'checked':'')+' onchange="S.settings.mode=\'write\';save()"> <span><b>Escriure</b> (recomanat: memoritzes millor; tolera accents i petites errades)</span></label>'+
    '<label class="radio"><input type="radio" name="md" '+(S.settings.mode==='choice'?'checked':'')+' onchange="S.settings.mode=\'choice\';save()"> <span><b>Opcions</b> (4 respostes; més ràpid al mòbil)</span></label>'+
    '<p class="muted">L\'examen de nivell sempre és escrivint, perquè mesuri el que recordes de veritat.</p></div>'+
    '<div class="card"><h3>Còpia de seguretat</h3><p class="sub">El progrés es desa en aquest iPhone, dins de l\'app. Desa\'n una còpia de tant en tant (per exemple a Fitxers o a iCloud Drive) per no perdre\'l si esborres l\'app.'+(S.lastBackup?' Última còpia: '+esc(S.lastBackup)+'.':'')+'</p>'+
    '<div class="row"><button class="btn pri" onclick="shareBackup(this)">Desa una còpia…</button><button class="btn" onclick="copyBackup(this)">Copia el text</button><button class="btn" onclick="document.getElementById(\'imp\').style.display=\'block\'">Importa</button></div>'+
    '<div id="imp" style="display:none;margin-top:10px"><label class="btn" style="margin-bottom:8px">Tria un fitxer de còpia<input type="file" accept=".json,application/json,text/plain" class="sr" onchange="importFile(this)"></label><textarea id="impt" rows="4" style="width:100%;font-size:16px" placeholder="…o enganxa aquí el text de la còpia"></textarea><div class="row" style="margin-top:6px"><button class="btn pri" onclick="importBackup()">Importa i substitueix</button><span id="impm" class="muted"></span></div></div></div>'+
    '<div class="card"><h3>Començar de zero</h3>'+(confirmReset?'<div class="confirm">S\'esborrarà tot el progrés, l\'examen de nivell i l\'historial. Segur?<div class="row" style="margin-top:8px"><button class="btn danger" onclick="doReset()">Sí, esborra-ho tot</button><button class="btn" onclick="confirmReset=false;render()">Cancel·la</button></div></div>':'<button class="btn danger" onclick="confirmReset=true;render()">Esborra el progrés</button>')+'</div>';
}
function markBackup(){S.lastBackup=new Date().toLocaleDateString('ca-ES');S.lastBackupN=tn();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function copyBackup(btn){const txt=JSON.stringify(S);navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copiada ✓';markBackup();},()=>{btn.textContent='No s\'ha pogut copiar';});}
async function shareBackup(btn){
  const name='capitals-copia-'+T()+'.json'; const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  try{const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Còpia de Capitals'});markBackup();btn.textContent='Desada ✓';return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();markBackup();btn.textContent='Descarregada ✓';
}
function importText(txt){const o=JSON.parse(txt);if(!o||o.v!==1||!o.cards)throw 0;S=o;if(!S.lastBackupN)S.lastBackupN=tn();save();}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;f.text().then(t=>{try{importText(t);const m=document.getElementById('impm')||document.getElementById('welm');if(m)m.textContent='Importada ✓';setTimeout(()=>go('avui'),600);}catch(e){const m=document.getElementById('impm')||document.getElementById('welm');if(m)m.textContent='Aquest fitxer no és una còpia vàlida.';}});}
function importBackup(id){try{importText(document.getElementById(id||'impt').value);const m=document.getElementById('impm')||document.getElementById('welm');if(m)m.textContent='Importada ✓';setTimeout(()=>go('avui'),600);}catch(e){const m=document.getElementById(id==='welt'?'welm':'impm');if(m)m.textContent='El text no és una còpia vàlida.';}}
function doReset(){S=fresh();confirmReset=false;save();go('avui');}

/* ============ INICI ============ */
(async function(){
  await initStore();
  render();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&route!=='quiz'&&route!=='study'){render();}});
</script>
